<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Doritos WebAR</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      background: rgba(0, 0, 0, 0.85);
    }
    #overlay[hidden] { display: none; }
    #start {
      font-size: 1.1rem;
      font-weight: 700;
      padding: 14px 32px;
      border: none;
      border-radius: 999px;
      background: #e4002b;
      color: #fff;
      cursor: pointer;
    }
    #start:disabled { opacity: 0.6; cursor: default; }
    #msg { margin: 0; min-height: 1.2em; opacity: 0.85; }

    /* ---- Botón de captura ---- */
    #captureBar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(24px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    #captureBar[hidden] { display: none; }
    #shutter {
      position: relative;
      width: 84px;
      height: 84px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    #shutter svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    #shutter .base { fill: none; stroke: #fff; stroke-width: 6; }
    #shutterRing { fill: none; stroke: #e4002b; stroke-width: 6; stroke-linecap: round; }
    #shutter .core {
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      transition: transform 0.15s, background 0.15s;
    }
    #shutter:active .core { transform: scale(0.9); }
    #shutter.recording .core { background: #e4002b; transform: scale(0.75); }
    #captureHint {
      margin: 0;
      font-size: 0.8rem;
      opacity: 0.85;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
    }

    /* ---- Vista previa ---- */
    #preview {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: #000;
      z-index: 20;
    }
    #preview[hidden] { display: none; }
    #preview .media {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #preview img, #preview video { max-width: 100%; max-height: 100%; object-fit: contain; }
    #preview img[hidden], #preview video[hidden] { display: none; }
    #preview .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      padding: 16px 16px max(16px, env(safe-area-inset-bottom));
    }
    #preview .actions button {
      flex: 1;
      max-width: 200px;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px 20px;
      border-radius: 999px;
      border: 2px solid #fff;
      cursor: pointer;
    }
    #saveBtn { background: #e4002b; border-color: #e4002b !important; color: #fff; }
    #retakeBtn { background: transparent; color: #fff; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="overlay">
    <button id="start">Iniciar cámara</button>
    <p id="msg"></p>
  </div>

  <div id="captureBar" hidden>
    <button id="shutter" aria-label="Tomar foto o mantener para grabar video">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="base" cx="50" cy="50" r="46"></circle>
        <circle id="shutterRing" cx="50" cy="50" r="46"></circle>
      </svg>
      <span class="core"></span>
    </button>
    <p id="captureHint">Toca para foto · Mantén para video</p>
  </div>

  <div id="preview" hidden>
    <div class="media">
      <img id="previewImg" alt="Tu foto con el filtro" hidden>
      <video id="previewVideo" playsinline loop muted hidden></video>
    </div>
    <div class="actions">
      <button id="retakeBtn">Repetir</button>
      <button id="saveBtn">Compartir</button>
    </div>
  </div>

  <script>
    // Muestra en pantalla cualquier error, útil para probar desde el celular.
    function showError(text) {
      var m = document.getElementById('msg');
      if (m) m.textContent = 'Error: ' + text;
    }
    window.addEventListener('error', function (e) { showError(e.message); });
    window.addEventListener('unhandledrejection', function (e) {
      showError((e.reason && e.reason.message) || e.reason);
    });
  </script>

  <script type="module" src="./main.js"></script>
</body>
</html>
