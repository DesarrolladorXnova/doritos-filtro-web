<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Doritos WebAR</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      background: rgba(0, 0, 0, 0.85);
    }
    #overlay[hidden] { display: none; }
    #start {
      font-size: 1.1rem;
      font-weight: 700;
      padding: 14px 32px;
      border: none;
      border-radius: 999px;
      background: #e4002b;
      color: #fff;
      cursor: pointer;
    }
    #start:disabled { opacity: 0.6; cursor: default; }
    #msg { margin: 0; min-height: 1.2em; opacity: 0.85; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="overlay">
    <button id="start">Iniciar cámara</button>
    <p id="msg"></p>
  </div>

  <script>
    // Muestra en pantalla cualquier error, útil para probar desde el celular.
    function showError(text) {
      var m = document.getElementById('msg');
      if (m) m.textContent = 'Error: ' + text;
    }
    window.addEventListener('error', function (e) { showError(e.message); });
    window.addEventListener('unhandledrejection', function (e) {
      showError((e.reason && e.reason.message) || e.reason);
    });
  </script>

  <script type="module">
    // Se intenta cargar el SDK desde varios CDN, por si alguno falla.
    const SDK_URLS = [
      'https://esm.sh/@snap/camera-kit',
      'https://cdn.jsdelivr.net/npm/@snap/camera-kit/+esm',
    ];

    async function loadSdk() {
      const errors = [];
      for (const url of SDK_URLS) {
        try {
          const mod = await import(url);
          if (mod.bootstrapCameraKit) return mod;
          errors.push(url + ': módulo incompleto');
        } catch (e) {
          console.error('No cargó', url, e);
          errors.push(url + ': ' + (e?.message || e));
        }
      }
      throw new Error('No se pudo cargar Camera Kit. ' + errors.join(' | '));
    }

    // ===== Configuración =====
    // Cambia a true cuando Snap apruebe la app y pega el token de Production abajo.
    const USE_PRODUCTION = false;

    const STAGING_API_TOKEN = 'eyJhbGciOiJIUzI1NiIsImtpZCI6IkNhbnZhc1MyU0hNQUNQcm9kIiwidHlwIjoiSldUIn0.eyJhdWQiOiJjYW52YXMtY2FudmFzYXBpIiwiaXNzIjoiY2FudmFzLXMyc3Rva2VuIiwibmJmIjoxNzkxOTA3ODM3LCJzdWIiOiI4ZDgwYjMxNS1iNjk1LTRkMGEtYjM3NC0xYjc5NjlmYTUwYTl-U1RBR0lOR34zMzY2ZDE2NC02NjgzLTRmMDktYmZhOS0yOTBhMWVmMmJmYzEifQ.NcHagxB6aa_vf3LnIS1nNMbH2zi5HsATd32se8oqKDg';
    const PRODUCTION_API_TOKEN = 'PEGA_AQUI_EL_TOKEN_DE_PRODUCTION';

    const LENS_GROUP_ID = 'b22f656b-6703-4d84-bffb-de04b99f8f6e';
    const LENS_ID = '4724530d-4b41-4868-a856-7b5c3f4f5deb';
    // =========================

    const API_TOKEN = USE_PRODUCTION ? PRODUCTION_API_TOKEN : STAGING_API_TOKEN;

    const canvas = document.getElementById('canvas');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start');
    const msg = document.getElementById('msg');

    let source;

    function resize() {
      if (!source) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      source.setRenderSize(
        Math.round(window.innerWidth * dpr),
        Math.round(window.innerHeight * dpr)
      );
    }

    async function start() {
      startBtn.disabled = true;
      msg.textContent = 'Cargando…';

      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error('Este navegador no permite usar la cámara. Abre la página con HTTPS en Chrome o Safari.');
        }

        msg.textContent = 'Cargando Camera Kit…';
        const { bootstrapCameraKit, createMediaStreamSource, Transform2D } = await loadSdk();

        msg.textContent = 'Iniciando…';
        const cameraKit = await bootstrapCameraKit({ apiToken: API_TOKEN });
        const session = await cameraKit.createSession({ liveRenderTarget: canvas });
        session.events.addEventListener('error', (e) => console.error('Error en el Lens:', e.detail));

        msg.textContent = 'Pidiendo permiso de cámara…';
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false,
        });

        source = createMediaStreamSource(stream, {
          transform: Transform2D.MirrorX,
          cameraType: 'user',
        });
        await session.setSource(source);
        resize();
        window.addEventListener('resize', resize);

        msg.textContent = 'Cargando el efecto…';
        const lens = await cameraKit.lensRepository.loadLens(LENS_ID, LENS_GROUP_ID);
        await session.applyLens(lens);
        await session.play();

        overlay.hidden = true;
      } catch (err) {
        console.error(err);
        if (err?.name === 'NotAllowedError') {
          msg.textContent = 'Necesitamos permiso para usar la cámara. Revisa los permisos del navegador e inténtalo de nuevo.';
        } else {
          msg.textContent = 'No se pudo iniciar: ' + (err?.message || err);
        }
        startBtn.disabled = false;
      }
    }

    startBtn.addEventListener('click', start);
  </script>
</body>
</html>
