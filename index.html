<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Doritos WebAR</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      background: rgba(0, 0, 0, 0.85);
    }
    #overlay[hidden] { display: none; }
    #start {
      font-size: 1.1rem;
      font-weight: 700;
      padding: 14px 32px;
      border: none;
      border-radius: 999px;
      background: #e4002b;
      color: #fff;
      cursor: pointer;
    }
    #start:disabled { opacity: 0.6; cursor: default; }
    #msg { margin: 0; min-height: 1.2em; opacity: 0.85; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="overlay">
    <button id="start">Iniciar cámara</button>
    <p id="msg"></p>
  </div>

  <script>
    // Muestra en pantalla cualquier error, útil para probar desde el celular.
    function showError(text) {
      var m = document.getElementById('msg');
      if (m) m.textContent = 'Error: ' + text;
    }
    window.addEventListener('error', function (e) { showError(e.message); });
    window.addEventListener('unhandledrejection', function (e) {
      showError((e.reason && e.reason.message) || e.reason);
    });
  </script>

  <script type="module" src="./main.js"></script>
</body>
</html>
